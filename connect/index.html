<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../home/theme.css" />
  <link rel="stylesheet" href="../home/navigation.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="api.js"></script>
<script src="session.js"></script>
<script src="function.js"></script>


<body>
  <div data-site-header></div>
  <div class="container">
    <h1>Connexion</h1>
    <p class="subtitle">Connectez-vous avec votre adresse mail et votre mot de passe.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Adresse mail</label>
        <input id="email" name="email" type="email" placeholder="contact@exemple.fr" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="accountType">Type de compte</label>
        <select id="accountType" name="accountType" required>
          <option value="pro">Professionnel</option>
          <option value="customer">Particulier</option>
        </select>
        <small>Si vous utilisez le même e-mail pour les deux comptes, choisissez l’espace correspondant et utilisez son mot de passe dédié.</small>
      </div>

      <div class="field">
        <button id="button" class="button" type="submit">Se connecter</button>
      </div>
    </form>

    <p id="message" class="status" role="status" aria-live="polite"></p>
  </div>
  <script src="../home/navigation.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      main();
    });
  </script>
</body>

  
</html>
