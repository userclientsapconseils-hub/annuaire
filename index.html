<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accueil</title>
  <link rel="stylesheet" href="home/styles.css" />
  <link rel="stylesheet" href="home/theme.css" />
  <link rel="stylesheet" href="home/navigation.css" />
</head>

<body>
  <section class="hero">
    <div data-site-header></div>

    <div class="content">
      <div class="search-wrap">
        <h1 class="headline">La Maison De Vos Rêves, ici</h1>

        <!-- Recherche : code postal + activité -->
        <form class="searchbar" id="searchForm" action="#" method="get" autocomplete="off">
          <!-- Code postal -->
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2c-3.86 0-7 3.14-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
            </svg>

            <input
              type="text"
              name="cp"
              inputmode="numeric"
              maxlength="5"
              pattern="[0-9]{5}"
              placeholder="Code postal (ex : 38500)"
              aria-label="Code postal"
              title="Saisissez un code postal à 5 chiffres"
              required
            />
          </div>

          <!-- Activité (liste déroulante) -->
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <!-- briefcase icon -->
              <path d="M10 4h4a2 2 0 0 1 2 2v2h3a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1h3V6a2 2 0 0 1 2-2zm4 4V6h-4v2h4zm-8 3v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8H6zm3 2h2v2H9v-2zm4 0h2v2h-2v-2z"/>
            </svg>

            <div class="select-wrap">
              <select name="activite" aria-label="Activité" required>
                <option value="" disabled selected>Choisir une activité</option>
                <option value="Jardinier/paysagiste">Jardinier/paysagiste</option>
                <option value="Ménage">Ménage</option>
                <option value="Cours à domicile">Cours à domicile</option>
                <option value="garde d'enfants">garde d'enfants</option>
              </select>

              <svg class="chev" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 10l5 5 5-5H7z"/>
              </svg>
            </div>
          </div>

          <button class="search-btn" type="submit" aria-label="Rechercher">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/>
            </svg>
          </button>
        </form>

        <div class="hint" id="hint"></div>

        <section class="search-results" id="searchResults" aria-live="polite" aria-label="Résultats de recherche"></section>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="connect/api.js"></script>
  <script src="connect/session.js"></script>
  <script src="home/script.js"></script>
  <script src="home/navigation.js"></script>
</body>
</html>
