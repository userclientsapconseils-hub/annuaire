<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Espace personnel particulier</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#111;font-family:Arial,sans-serif}.container{max-width:1050px;margin:55px auto;padding:18px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 15px 40px #0005}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0}button,.link{border:0;border-radius:8px;background:#e53935;color:#fff;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}.info,.status,.empty{margin-top:20px;padding:14px;border-radius:10px;background:#f3f4f6}.status.warning{background:#fff7ed;color:#9a3412}.table-wrap{overflow:auto;margin-top:22px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:14px}th{background:#f3f4f6;color:#4b5563}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fff7ed;color:#9a3412}.validated{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}@media(max-width:650px){.container{margin:20px auto}.card{padding:18px}}
  </style>
  <link rel="stylesheet" href="../home/theme.css" />
  <link rel="stylesheet" href="../home/navigation.css">
</head>
<body>
  <div data-site-header></div>
<main class="container"><section class="card">
  <div class="top"><h1>Mon espace personnel particulier</h1><button id="logout">Déconnexion</button></div>
  <p>Retrouvez ici toutes les demandes de devis que vous avez envoyées.</p>
  <div class="info"><strong>E-mail :</strong> <span id="email"></span></div>
  <div class="actions"><a class="link" href="../annonces/index.html">Consulter les annonces</a></div>
  <p id="status" class="status">Chargement de vos demandes…</p>
  <div id="requests" aria-live="polite"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../connect/api.js"></script>
<script src="../connect/session.js"></script>
<script>
function logout() {
  AuthSession.clear();
  location.href = '../connect/index.html';
}

function parse(value) {
  if (typeof value === 'string') {
    try { return parse(JSON.parse(value)); } catch { return []; }
  }
  if (Array.isArray(value)) return value.flatMap(parse);
  if (!value || typeof value !== 'object') return [];
  const own = ('requestId' in value || 'customerEmail' in value) ? [value] : [];
  return own.concat(['data', 'body', 'items', 'Items', 'records', 'results'].flatMap((key) => key in value ? parse(value[key]) : []));
}

function esc(value) {
  return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function date(value) {
  const parsedDate = new Date(value);
  return value && !Number.isNaN(parsedDate.getTime())
    ? new Intl.DateTimeFormat('fr-FR', { dateStyle: 'medium' }).format(parsedDate)
    : 'Non précisée';
}

document.getElementById('logout').onclick = logout;

(async () => {
  const status = document.getElementById('status');
  const root = document.getElementById('requests');
  const session = AuthSession.get();
  if (!session) {
    logout();
    return;
  }

  const email = String(session.email || '').trim().toLowerCase();
  document.getElementById('email').textContent = email;

  try {
    const accountType = await ApiClient.getUserAccountType(session.token, email);
    if (accountType !== 'customer') {
      logout();
      return;
    }

    AuthSession.persist(session.token, email, accountType);
    const [requestsPayload, responsesPayload] = await Promise.all([
      ApiClient.findQuoteRequests(session.token),
      ApiClient.findQuoteResponses(session.token)
    ]);
    const responses = parse(responsesPayload);
    const items = parse(requestsPayload)
      .filter((item) => String(item.customerEmail || '').trim().toLowerCase() === email)
      .map((item) => {
        const requestId = String(item.requestId || '').trim();
        const professionalUserNumber = Number(item.professionalUserNumber || item.share);
        const response = responses
          .filter((candidate) => String(candidate.requestId || '').trim() === requestId
            && Number(candidate.userNumber) === professionalUserNumber
            && ['validated', 'rejected'].includes(candidate.status))
          .sort((a, b) => String(b.respondedAt || b.date || '').localeCompare(String(a.respondedAt || a.date || '')))[0];
        return { ...item, status: response?.status || 'pending' };
      })
      .sort((a, b) => String(b.createdAt || b.date || '').localeCompare(String(a.createdAt || a.date || '')));

    status.style.display = 'none';
    if (!items.length) {
      root.innerHTML = '<p class="empty">Vous n’avez envoyé aucune demande de devis pour le moment.</p>';
      return;
    }

    const labels = { pending: 'En attente', validated: 'Validée', rejected: 'Refusée' };
    root.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Professionnel</th><th>Prestation</th><th>Envoyée le</th><th>Date souhaitée</th><th>Statut</th></tr></thead><tbody>${items.map((item) => {
      const itemStatus = ['pending', 'validated', 'rejected'].includes(item.status) ? item.status : 'pending';
      return `<tr><td>${esc(item.professionalName || 'Professionnel')}</td><td>${esc(item.service || 'À préciser')}</td><td>${esc(date(item.createdAt || item.date))}</td><td>${esc(date(item.desiredDate))}</td><td><span class="badge ${itemStatus}">${labels[itemStatus]}</span></td></tr>`;
    }).join('')}</tbody></table></div>`;
  } catch (error) {
    if ([301, 401, 403, 404].includes(Number(error?.response?.status))) {
      logout();
      return;
    }
    console.warn('Impossible de vérifier votre session ou de charger vos demandes.');
    status.className = 'status warning';
    status.textContent = 'Impossible de vérifier votre session ou de charger vos demandes pour le moment.';
  }
})();
</script>
  <script src="../home/navigation.js"></script>
</body></html>
